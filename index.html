<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop_Cat</title>
  </head>
  <body>
    <canvas id="pet-canvas"></canvas>

    <div id="update-toast" class="update-toast hidden" role="status" aria-live="polite">
      <span class="update-toast-text" id="update-toast-text">✨ 发现新版本</span>
      <button class="update-toast-btn hidden" id="btn-toast-install" type="button">立即更新</button>
      <button class="update-toast-btn secondary hidden" id="btn-toast-open" type="button">发布页</button>
      <button class="update-toast-close" id="btn-toast-close" type="button" title="稍后提醒">×</button>
    </div>

    <div id="context-menu" class="context-menu hidden">
      <div class="menu-header" id="menu-header">🐈‍⬛ Desktop_Cat 小黑猫</div>
      <div class="menu-scale-row">
        <span class="menu-scale-label">猫咪外观（支持 MCP 定制）</span>
        <div class="breed-pills" id="breed-pills">
          <button class="breed-pill active" data-breed="black">🐈‍⬛ 小黑猫</button>
          <button class="breed-pill" data-breed="ragdoll">🐱 布偶猫</button>
        </div>
      </div>
      <div class="menu-sep"></div>
      <button class="menu-item" data-action="toggle-bubbles">
        <span>悬浮按键气泡</span>
        <span class="menu-check" id="chk-bubbles">✓</span>
      </button>
      <button class="menu-item" data-action="toggle-lock">
        <span>锁定鼠标穿透</span>
        <span class="menu-check" id="chk-lock"></span>
      </button>
      <button class="menu-item" data-action="toggle-sound">
        <span>摸头呼噜声</span>
        <span class="menu-check" id="chk-sound">✓</span>
      </button>
      <button class="menu-item" data-action="toggle-top">
        <span>始终置顶显示</span>
        <span class="menu-check" id="chk-top">✓</span>
      </button>
      <button class="menu-item" data-action="toggle-autostart">
        <span>开机自动启动</span>
        <span class="menu-check" id="chk-autostart"></span>
      </button>
      <div class="menu-sep"></div>
      <button class="menu-item" data-action="toggle-mcp">
        <span>开启 MCP 扩展</span>
        <span class="menu-check" id="chk-mcp">✓</span>
      </button>
      <button class="menu-item" data-action="copy-mcp" id="btn-copy-mcp">
        <span>复制 MCP 配置</span>
        <span class="menu-hint" id="mcp-copy-hint">AI 捏猫</span>
      </button>
      <div class="menu-sep"></div>
      <div class="menu-scale-row">
        <span class="menu-scale-label">缩放</span>
        <div class="scale-pills">
          <button class="scale-pill" data-scale="0.75">75%</button>
          <button class="scale-pill" data-scale="1">100%</button>
          <button class="scale-pill" data-scale="1.25">125%</button>
          <button class="scale-pill" data-scale="1.5">150%</button>
        </div>
      </div>
      <div class="menu-sep"></div>
      <button class="menu-item" data-action="desktop-shortcut" id="btn-desktop-shortcut">
        <span>创建桌面图标</span>
        <span class="menu-hint" id="shortcut-hint">Desktop_Cat</span>
      </button>
      <button class="menu-item" data-action="reset-pos">
        <span>重置位置到右下角</span>
      </button>
      <button class="menu-item" data-action="check-update" id="btn-check-update">
        <span>检查更新</span>
        <span class="menu-hint" id="update-hint">v4.4.0</span>
      </button>
      <button class="menu-item danger" data-action="quit">
        <span>退出 Desktop_Cat</span>
      </button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
